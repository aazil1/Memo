<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MemoZ</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--text:#3b2a30;--muted:#8a6f78;--accent:#e0507a;--accent-text:#fff;--line:#f3d3dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1318;--card:#2a1b22;--text:#f6e6ec;--muted:#b997a4;--accent:#ee6a92;--accent-text:#2a0f19;--line:#433039;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1318;--card:#2a1b22;--text:#f6e6ec;--muted:#b997a4;--accent:#ee6a92;--accent-text:#2a0f19;--line:#433039;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 26px;text-align:center;max-width:340px;width:100%}
.box h1{margin:0 0 6px;font-size:1.6rem}
.box p{color:var(--muted);margin:0 0 18px}
input[type=password],input[type=text],input[type=email],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
textarea{min-height:100px;resize:vertical}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:bold}
.err{color:#d33;min-height:1.3em;margin-top:8px;font-size:.9rem}
/* app */
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h2{margin:6px 0 14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:20px}
.form label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:4px}
.form input[type=file]{margin-bottom:10px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden}
.item img{width:100%;height:170px;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px}
.item audio{width:100%;margin:6px 0}
.item .tag{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.item .ttl{font-weight:bold;word-break:break-word}
.item .desc{color:var(--muted);font-size:.9rem;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.item .note{white-space:pre-wrap;max-height:140px;overflow:auto;font-size:.92rem;margin:6px 0}
.item .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;padding:6px 0 0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.play{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:bold;word-break:break-word}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--card);border-radius:14px;padding:14px;width:100%;max-width:560px}
.mbox iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;font-weight:bold}
.mhead button{background:none;border:0;font-size:1.3rem;cursor:pointer}
.mbox a{color:var(--accent);font-size:.9rem;display:inline-block;margin-top:8px}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <p>Connecting securely...</p>
    <div class="err" id="err"></div>
    <button class="btn hidden" id="retry">Try again</button>
  </div>
</div>

<div id="player" class="modal hidden">
  <div class="mbox">
    <div class="mhead"><span id="ptitle"></span><button id="pclose" aria-label="Close">✕</button></div>
    <iframe id="pframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <a id="plink" target="_blank" rel="noopener">Open on YouTube</a>
  </div>
</div>

<div id="app" class="hidden">
  <nav>
    <button data-p="home" class="active">Home</button>
    <button data-p="music">Music</button>
    <button data-p="notes">Notes</button>
    <button data-p="gallery">Gallery</button>
  </nav>
  <main>
    <section id="home">
      <h2>Recently added</h2>
      <div class="grid" id="homeList"></div>
    </section>

    <section id="music" class="hidden">
      <h2>Music 🎵</h2>
      <div class="form">
        <label>Song title</label><input type="text" id="musicTitle" maxlength="80" placeholder="Song name">
        <label>YouTube link</label><input type="text" id="musicLink" placeholder="https://www.youtube.com/watch?v=...">
        <label>Short description</label><input type="text" id="musicDesc" maxlength="140" placeholder="Why this song?">
        <button class="btn" data-add="music">Add song</button>
      </div>
      <div class="grid" id="musicList"></div>
    </section>

    <section id="notes" class="hidden">
      <h2>Notes 📝</h2>
      <div class="form">
        <label>Write a note</label>
        <textarea id="noteText" placeholder="Write something"></textarea>
        
        <label>Short description</label><input type="text" id="noteDesc" maxlength="140" placeholder="Title or short description">
        <button class="btn" data-add="notes">Add note</button>
      </div>
      <div class="grid" id="notesList"></div>
    </section>

    <section id="gallery" class="hidden">
      <h2>Gallery 📷</h2>
      <div class="form">
        <label>Choose a picture</label><input type="file" id="galleryFile" accept="image/*">
        <label>Short description</label><input type="text" id="galleryDesc" maxlength="140" placeholder="What's the memory?">
        <button class="btn" data-add="gallery">Add picture</button>
      </div>
      <div class="grid" id="galleryList"></div>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  addDoc, collection, deleteDoc, doc, getDocs, getFirestore, orderBy, query
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAA6LxqN2Wpppn2WgIj5O86x5J0ZJ0d7Mw",
  authDomain: "memo-77b64.firebaseapp.com",
  projectId: "memo-77b64",
  storageBucket: "memo-77b64.firebasestorage.app",
  messagingSenderId: "524588282947",
  appId: "1:524588282947:web:98c40f246cdbe4b3cfd0f6",
  measurementId: "G-C47L5DHB2V"
};
const configured = Object.values(firebaseConfig).every(function (value) {
  return value && !value.startsWith("YOUR_");
});
const err = document.getElementById("err");
const retryButton = document.getElementById("retry");
let auth;
let db;

if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  retryButton.onclick = startAnonymousSession;
  onAuthStateChanged(auth, function (user) {
    if (user) {
      retryButton.classList.add("hidden");
      err.textContent = "";
      document.getElementById("login").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      render();
    } else {
      startAnonymousSession();
    }
  });
} else {
  err.textContent = "Firebase is not configured yet. Add your Firebase web app config to this file.";
}

let anonymousSignInInProgress = false;
async function startAnonymousSession() {
  if (!configured) return;
  if (anonymousSignInInProgress || auth.currentUser) return;
  anonymousSignInInProgress = true;
  retryButton.disabled = true;
  err.textContent = "";
  try {
    await signInAnonymously(auth);
  } catch (error) {
    console.error("Firebase anonymous sign-in failed:", error);
    err.textContent = "Could not connect. Enable Anonymous sign-in in Firebase, then try again.";
    retryButton.classList.remove("hidden");
  } finally {
    anonymousSignInInProgress = false;
    retryButton.disabled = false;
  }
}

// ---------- Firebase database ----------
const itemsCollection = function () { return collection(db, "items"); };
async function addItem(item) {
  return addDoc(itemsCollection(), item);
}
async function delItem(item) {
  await deleteDoc(doc(db, "items", item.id));
}
async function allItems() {
  const snapshot = await getDocs(query(itemsCollection(), orderBy("created", "desc")));
  return snapshot.docs.map(function (itemDoc) {
    return Object.assign({ id: itemDoc.id }, itemDoc.data());
  });
}

// ---------- Navigation ----------
const pages = ["home", "music", "notes", "gallery"];
document.querySelectorAll("nav button").forEach(function (button) {
  button.onclick = async function () {
    pages.forEach(function (page) {
      document.getElementById(page).classList.toggle("hidden", page !== button.dataset.p);
    });
    document.querySelectorAll("nav button").forEach(function (navButton) {
      navButton.classList.toggle("active", navButton === button);
    });
    await render();
  };
});

// ---------- Adding things ----------
function ytId(link) {
  const match = link.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return match ? match[1] : null;
}
function openPlayer(item) {
  document.getElementById("ptitle").textContent = item.name;
  document.getElementById("pframe").src = "https://www.youtube-nocookie.com/embed/" + item.vid + "?autoplay=1";
  document.getElementById("plink").href = "https://www.youtube.com/watch?v=" + item.vid;
  document.getElementById("player").classList.remove("hidden");
}
function closePlayer() {
  document.getElementById("pframe").src = "about:blank";
  document.getElementById("player").classList.add("hidden");
}
document.getElementById("pclose").onclick = closePlayer;
document.getElementById("player").onclick = function (event) {
  if (event.target === this) closePlayer();
};

const MAX_PHOTO_DATA_URL_LENGTH = 850000;
function blobAsDataUrl(blob) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onload = function () {
      if (typeof reader.result !== "string") {
        reject(new Error("Could not encode the compressed photo."));
        return;
      }
      resolve(reader.result);
    };
    reader.onerror = function () {
      reject(reader.error || new Error("Could not read the compressed photo."));
    };
    reader.readAsDataURL(blob);
  });
}
async function compressPhoto(file) {
  const bitmap = await createImageBitmap(file);
  try {
    let scale = Math.min(1, 1280 / Math.max(bitmap.width, bitmap.height));
    for (let attempt = 0; attempt < 15; attempt += 1) {
      if (attempt > 0 && attempt % 5 === 0) scale *= 0.75;
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));
      const context = canvas.getContext("2d");
      if (!context) throw new Error("Could not prepare the photo for compression.");
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      const quality = Math.max(0.45, 0.82 - (attempt % 5) * 0.09);
      const compressed = await new Promise(function (resolve, reject) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error("The browser could not compress this photo."));
        }, "image/jpeg", quality);
      });
      if (compressed.size < MAX_PHOTO_DATA_URL_LENGTH * 3 / 4) {
        const dataUrl = await blobAsDataUrl(compressed);
        if (dataUrl.length <= MAX_PHOTO_DATA_URL_LENGTH) return dataUrl;
      }
    }
    throw new Error("Compressed photo is still too large for Firestore.");
  } finally {
    bitmap.close();
  }
}

document.querySelectorAll("[data-add]").forEach(function (button) {
  button.onclick = async function () {
    const type = button.dataset.add;
    const desc = document.getElementById(
      { music: "musicDesc", notes: "noteDesc", gallery: "galleryDesc" }[type]
    ).value.trim();
    const item = { type: type, desc: desc, created: Date.now() };
    if (type === "notes") {
      const text = document.getElementById("noteText").value.trim();
      if (!text) { alert("Write a note first."); return; }
      item.text = text;
    } else if (type === "music") {
      const link = document.getElementById("musicLink").value.trim();
      const vid = ytId(link);
      if (!vid) { alert("Please paste a valid YouTube link."); return; }
      item.vid = vid;
      item.link = link;
      item.name = document.getElementById("musicTitle").value.trim() || "Untitled song";
    } else {
      const file = document.getElementById("galleryFile").files[0];
      if (!file) { alert("Please choose a picture first."); return; }
      if (!file.type.startsWith("image/") || file.size > 5 * 1024 * 1024) {
        alert("Choose an image smaller than 5 MB.");
        return;
      }
      item.imageData = await compressPhoto(file).catch(function (error) {
        console.error("Photo compression failed:", error);
        return null;
      });
      if (!item.imageData) {
        alert("Could not compress that photo. Try a different image.");
        return;
      }
      item.name = file.name;
    }

    button.disabled = true;
    try {
      await addItem(item);
      document.querySelectorAll("#" + type + " input, #" + type + " textarea").forEach(function (input) {
        input.value = "";
      });
      await render();
    } catch (error) {
      console.error("Firebase save failed:", error);
      alert("Could not save this item. Check your Firebase setup and internet connection.");
    } finally {
      button.disabled = false;
    }
  };
});

// ---------- Rendering ----------
function card(item) {
  const element = document.createElement("div");
  element.className = "item";
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = { music: "🎵 Music", notes: "📝 Note", gallery: "📷 Photo" }[item.type];
  element.appendChild(tag);
  if (item.type === "gallery") {
    if (item.imageData) {
      const image = document.createElement("img");
      image.src = item.imageData;
      image.alt = item.desc || item.name;
      element.insertBefore(image, tag);
    } else {
      const unavailable = document.createElement("div");
      unavailable.className = "desc";
      unavailable.textContent = "This photo was saved using the previous storage setup.";
      element.appendChild(unavailable);
    }
  }
  if (item.type === "music") {
    const playButton = document.createElement("button");
    playButton.className = "play";
    playButton.textContent = "▶ " + item.name;
    playButton.onclick = function () { if (item.vid) openPlayer(item); };
    element.appendChild(playButton);
  }
  if (item.type === "notes") {
    const note = document.createElement("div");
    note.className = "note";
    note.textContent = item.text;
    element.appendChild(note);
  }
  if (item.desc) {
    const description = document.createElement("div");
    description.className = "desc";
    description.textContent = item.desc;
    element.appendChild(description);
  }
  const deleteButton = document.createElement("button");
  deleteButton.className = "del";
  deleteButton.textContent = "Delete";
  deleteButton.onclick = async function () {
    if (!confirm("Delete this?")) return;
    try {
      await delItem(item);
      await render();
    } catch (error) {
      console.error("Firebase delete failed:", error);
      alert("Could not delete this item. Check your Firebase setup and internet connection.");
    }
  };
  element.appendChild(deleteButton);
  return element;
}
function fill(id, list, emptyMessage) {
  const element = document.getElementById(id);
  element.innerHTML = "";
  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1/-1";
    empty.textContent = emptyMessage;
    element.appendChild(empty);
    return;
  }
  list.forEach(function (item) { element.appendChild(card(item)); });
}
async function render() {
  try {
    const items = await allItems();
    fill("homeList", items.slice(0, 8), "Nothing here yet — add something!");
    ["music", "notes", "gallery"].forEach(function (type) {
      fill(type + "List", items.filter(function (item) { return item.type === type; }), "Nothing added yet.");
    });
  } catch (error) {
    console.error("Firebase data load failed:", error);
    alert("Could not load your memories. Check your Firebase setup and internet connection.");
  }
}
</script>
</body>
</html>
